# Сборка ПОДПИСАННОГО APK в облаке GitHub Actions.
# Подписанный release-APK не блокируется Play Protect (в отличие от debug).
# Ключ подписи генерируется в самой сборке и не хранится в репозитории.

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установить зависимости
        run: npm ci || npm install

      - name: Собрать веб-часть
        run: npm run build

      - name: Добавить Android-платформу Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/geolocation@6
          npx cap add android
          npx cap sync android

      - name: Подготовить манифест и подпись
        run: node scripts/patch-manifest.mjs

      - name: Создать ключ подписи
        run: |
          mkdir -p android/keystore
          keytool -genkeypair -v \
            -keystore android/keystore/scanreal.jks \
            -alias scanreal \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass scanreal2026 -keypass scanreal2026 \
            -dname "CN=ScanReal, OU=Mobile, O=ScanReal, L=Moscow, C=RU"
          echo "Ключ создан"

      - name: Собрать подписанный APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/scanreal.jks
          KEYSTORE_PASSWORD: scanreal2026
          KEY_ALIAS: scanreal
          KEY_PASSWORD: scanreal2026
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Проверить подпись и подписать если нужно
        run: |
          cd android
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          SIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          if "$SIGNER" verify --print-certs "$APK" > /dev/null 2>&1; then
            echo "APK уже подписан"
          else
            echo "Подписываем через apksigner"
            "$SIGNER" sign --ks keystore/scanreal.jks \
              --ks-pass pass:scanreal2026 --key-pass pass:scanreal2026 \
              --ks-key-alias scanreal "$APK"
          fi
          echo "=== ПОДПИСЬ ==="
          "$SIGNER" verify --print-certs "$APK" | head -10

      - name: Показать результат
        run: find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ScanReal-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
